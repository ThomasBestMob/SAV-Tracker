name: eDesk Sync

on:
  # Run automatique horaire désactivé temporairement (échecs répétés en prod,
  # 2026-07-06) — à réactiver une fois les correctifs de sync stabilisés.
  # schedule:
  #   - cron: "0 * * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (n'écrit rien dans Supabase, affiche un échantillon)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      full_sync:
        description: "Full sync (ignore le curseur incrémental, retélécharge tout)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      ticket_limit:
        description: "Test rapide : ne traiter que N tickets les plus récents (vide = tous)"
        required: false
        default: ""
        type: string
      ticket_lookback_days:
        description: "Profondeur d'historique tickets en jours (défaut 14 ; 180 pour alimenter l'analyse produit)"
        required: false
        default: ""
        type: string
      sales_order_lookback_days:
        description: "Profondeur d'historique commandes en jours (défaut 90) — à augmenter pour rattacher les tickets anciens"
        required: false
        default: ""
        type: string
      reclassify_only:
        description: "Reclassifier depuis la base seule (aucun appel eDesk) — pour ajuster la taxonomie des défauts produit"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  sync:
    name: Sync eDesk → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run eDesk sync
        env:
          EDESK_API_TOKEN: ${{ secrets.EDESK_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FULL_SYNC: ${{ github.event.inputs.full_sync || 'false' }}
          TICKET_SYNC_LIMIT: ${{ github.event.inputs.ticket_limit }}
          TICKET_LOOKBACK_DAYS: ${{ github.event.inputs.ticket_lookback_days || '14' }}
          SALES_ORDER_LOOKBACK_DAYS: ${{ github.event.inputs.sales_order_lookback_days || '90' }}
          RECLASSIFY_ONLY: ${{ github.event.inputs.reclassify_only || 'false' }}
        run: node sync/edesk_sync.js

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Le sync eDesk a échoué. Vérifiez les logs ci-dessus."
          echo "::error::Vérifiez que les secrets EDESK_API_TOKEN, SUPABASE_URL et SUPABASE_SERVICE_ROLE_KEY sont bien configurés dans Settings > Secrets > Actions."
          echo "::error::Le jeton eDesk expire par défaut à 90 jours — pensez à le régénérer si l'erreur est un 401."
